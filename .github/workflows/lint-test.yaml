---
on: [push, pull_request]
name: lint-test

jobs:
  stylua:
    name: stylua
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          version: latest
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --color always --check lua

  luacheck:
    name: luacheck
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: lunarmodules/luacheck@v1

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, xcode-27, windows-2025]
        nvim-versions: ['stable', 'nightly']
    name: test (${{ matrix.os }}, ${{ matrix.nvim-versions }})
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-versions }}

      - name: run tests
        run: make test
        env:
          PLENARY_DIR: ${{ runner.temp }}/plenary.nvim
